<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backlog">
<title>Backlog</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2; --card: #fff; --text: #1f2328; --muted: #6b7280; --line: #e3e1dc;
    --accent: #2f6feb; --err: #c0392b; --ok: #2e7d32;
    --s-new-bg: #e6efff; --s-new-fg: #1d4fb8;
    --s-open-bg: #fff1d6; --s-open-fg: #8a5a00;
    --s-done-bg: #e3f4e5; --s-done-fg: #1f6b2a;
    --tag-l-bg: 93%; --tag-l-fg: 30%;
    /* diagram (referenspalett, slot 1–2) */
    --surface-1: #fcfcfb; --series-1: #2a78d6; --series-2: #eb6834;
    --grid: #e7e5e0; --axis: #b9b6ae;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #16181c; --card: #1f2227; --text: #e6e6e6; --muted: #9aa0a6; --line: #33373e;
      --accent: #6ea0ff; --err: #ff7b6b; --ok: #7ccf82;
      --s-new-bg: #1e2f52; --s-new-fg: #a9c4ff;
      --s-open-bg: #3d2f12; --s-open-fg: #f5c76b;
      --s-done-bg: #1c3a22; --s-done-fg: #8fd99a;
      --tag-l-bg: 24%; --tag-l-fg: 82%;
      --surface-1: #1a1a19; --series-1: #3987e5; --series-2: #d95926;
      --grid: #2e2e2c; --axis: #55544f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 10px; padding: .5rem .8rem; min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--err); }
  button.ghost { border-color: transparent; background: transparent; }
  button:disabled { opacity: .6; cursor: wait; }
  input, textarea, select { font: inherit; font-size: 16px; padding: .65rem .75rem; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--text); width: 100%; }
  textarea { resize: vertical; }
  .err { color: var(--err) !important; min-height: 1.2em; margin: 0; font-size: .9rem; }

  /* ---- Inloggning ---- */
  .screen { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.6rem; width: 100%; max-width: 380px; display: grid; gap: .8rem; }
  .card h1 { margin: 0; font-size: 1.4rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; }
  label.check { display: flex; gap: .5rem; align-items: center; font-size: .9rem; color: var(--muted); }
  label.check input { width: auto; }

  /* ---- App ---- */
  .wrap { max-width: 640px; margin: 0 auto; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(.5rem + env(safe-area-inset-top)) .75rem .5rem; border-bottom: 1px solid var(--line); }
  .toprow { display: flex; align-items: center; gap: .5rem; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .tabs button { border: 0; min-height: 34px; padding: .3rem .8rem; border-radius: 8px; background: transparent; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  #status { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  #status.dirty { color: var(--err); } #status.saved { color: var(--ok); }
  #menuBtn { font-size: 1.3rem; line-height: 1; padding: 0 .7rem; }

  .filterrow { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; }
  #statusSelect { width: auto; flex: none; padding: .4rem 2rem .4rem .7rem; min-height: 36px; background-color: var(--card);
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right .95rem center, right .65rem center; background-size: 5px 5px; background-repeat: no-repeat; }
  .chips { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrapping { flex-wrap: wrap; overflow: visible; }
  .chip { flex: none; min-height: 34px; padding: .25rem .75rem; border-radius: 999px; font-size: .9rem;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .chip .n { opacity: .6; margin-left: .25rem; font-size: .8rem; }
  .chip.tag.on { background: hsl(var(--h) 60% 45%); border-color: hsl(var(--h) 60% 45%); color: #fff; }

  /* ---- Lista ---- */
  ul.list { position: relative; list-style: none; margin: 0; padding: .2rem .75rem calc(3rem + env(safe-area-inset-bottom)); }
  .row { position: relative; }
  .ins { height: 18px; display: flex; align-items: center; justify-content: center; }
  .ins button { min-height: 0; height: 18px; width: 72px; padding: 0; border: 0; background: transparent;
    color: var(--muted); opacity: .5; font-size: 1rem; line-height: 1; border-radius: 6px; }
  .ins button:hover, .ins button:focus-visible { opacity: 1; color: var(--accent); }
  body.is-dragging .ins button { visibility: hidden; }

  .item { display: grid; grid-template-columns: 1fr auto; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 0 0 .7rem;
    transition: background-color .4s; }
  .item.flash { background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .row.dragging { z-index: 3; }
  .row.dragging .item { box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: none; }
  .item .body { min-width: 0; cursor: pointer; padding: .45rem 0; display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .4rem;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .item .title { overflow-wrap: anywhere; }
  .item.s-done .title { color: var(--muted); text-decoration: line-through; }
  .item .note { color: var(--muted); font-size: .8rem; }
  .tagchip { font-size: .75rem; padding: .05rem .5rem; border-radius: 999px;
    background: hsl(var(--h) 60% var(--tag-l-bg)); color: hsl(var(--h) 55% var(--tag-l-fg)); }
  .handle { touch-action: none; cursor: grab; color: var(--muted); align-self: stretch; display: grid; place-items: center;
    width: 44px; font-size: 1.1rem; letter-spacing: -2px; user-select: none; -webkit-user-select: none; }
  .row.dragging .handle { cursor: grabbing; color: var(--accent); }
  body.is-dragging { user-select: none; -webkit-user-select: none; }
  .item.pressing { background: color-mix(in srgb, var(--text) 6%, var(--card)); }

  /* Inline-redigering */
  .item.editing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .edit { display: grid; padding: .2rem 0 .3rem; min-width: 0; }
  .edit input, .edit textarea { border: 0; background: transparent; padding: .3rem 0; border-radius: 0; outline: none; }
  .edit .e-title { font-weight: 600; }
  .edit .e-notes { font-size: .95rem; color: var(--muted); resize: none; min-height: 1.9em; overflow: hidden; border-top: 1px dashed var(--line); }

  .empty { text-align: center; color: var(--muted); padding: 1.5rem 1rem 0; font-size: .95rem; }

  /* ---- Dialoger ---- */
  dialog { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog.small { border-radius: 14px; width: min(92vw, 400px); }
  dialog.small .card { border: 0; max-width: none; }
  #tagBox h1 { font-size: 1.1rem; overflow-wrap: anywhere; }
  .lbl { font-size: .8rem; color: var(--muted); margin-bottom: -.4rem; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: .35rem; }
  .seg button.on.s-new { background: var(--s-new-bg); color: var(--s-new-fg); border-color: var(--s-new-fg); font-weight: 600; }
  .seg button.on.s-open { background: var(--s-open-bg); color: var(--s-open-fg); border-color: var(--s-open-fg); font-weight: 600; }
  .seg button.on.s-done { background: var(--s-done-bg); color: var(--s-done-fg); border-color: var(--s-done-fg); font-weight: 600; }
  .tagadd { display: flex; gap: .4rem; }
  .tagadd button { white-space: nowrap; }
  .row-btns { display: flex; gap: .5rem; }
  .row-btns > button { flex: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  details ul { margin: .4rem 0 0; padding-left: 1.1rem; font-size: .85rem; color: var(--muted); }
  .menu { display: grid; gap: .5rem; padding: 1rem; }

  /* ---- Statistik ---- */
  .stats { padding: .75rem .75rem calc(2rem + env(safe-area-inset-bottom)); display: grid; gap: .75rem; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; }
  .tile .v { font-size: 1.6rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: .8rem; color: var(--muted); }
  .panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: .8rem; }
  .panel h3 { margin: 0; font-size: 1rem; }
  .panel-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
  .panel-head .tabs button { min-height: 30px; font-size: .85rem; padding: .2rem .6rem; }
  .legend { display: flex; gap: 1rem; font-size: .8rem; color: var(--muted); margin: .2rem 0 .4rem; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: .35rem; vertical-align: -1px; background: var(--c); }
  #chart { position: relative; touch-action: pan-y; }
  #chart svg { display: block; overflow: visible; }
  #chart .grid { stroke: var(--grid); stroke-width: 1; }
  #chart .base { stroke: var(--axis); stroke-width: 1; }
  #chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  #chart .bar.c { fill: var(--series-1); }
  #chart .bar.d { fill: var(--series-2); }
  #chart svg.active .grp:not(.on) { opacity: .35; }
  #chart .hit { fill: transparent; cursor: pointer; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: .35rem .55rem; font-size: .8rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); white-space: nowrap; }
  .tip b { display: block; margin-bottom: .1rem; }
  .tip i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: .3rem; }
  table.data { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; margin-top: .4rem; }
  table.data th, table.data td { text-align: right; padding: .25rem .4rem; border-bottom: 1px solid var(--line); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<div id="loading" class="screen"><p>Laddar…</p></div>

<div id="lock" class="screen" hidden>
  <form id="lockForm" class="card">
    <h1>Backlog</h1>
    <p id="lockHint">Ange lösenord för att visa innehållet.</p>
    <input type="password" id="pw" placeholder="Lösenord" autocomplete="current-password" required>
    <input type="password" id="pw2" placeholder="Upprepa lösenord" autocomplete="new-password" hidden>
    <label class="check"><input type="checkbox" id="remember" checked> Håll mig inloggad på den här enheten</label>
    <button type="submit" class="primary" id="lockBtn">Lås upp</button>
    <p class="err" id="lockErr"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="toprow">
      <div class="tabs" id="viewTabs">
        <button data-view="list" class="on">Backlog</button>
        <button data-view="stats">Statistik</button>
      </div>
      <span class="spacer"></span>
      <span id="status"></span>
      <button id="menuBtn" class="ghost" aria-label="Meny">⋯</button>
    </div>
    <div class="filterrow" id="filters">
      <select id="statusSelect" aria-label="Visa status"></select>
      <div class="chips" id="tagFilter"></div>
    </div>
  </div></header>

  <main class="wrap">
    <section id="listView">
      <ul class="list" id="list"></ul>
    </section>
    <section id="statsView" class="stats" hidden></section>
  </main>
</div>

<!-- Långt tryck: taggar, status, ta bort -->
<dialog id="tagBox" class="small">
  <div class="card">
    <h1 id="tbTitle"></h1>
    <div class="lbl">Taggar</div>
    <div class="chips wrapping" id="tbTags"></div>
    <div class="tagadd">
      <input id="tbNewTag" placeholder="Ny tagg" maxlength="30" autocomplete="off" enterkeyhint="done">
      <button type="button" id="tbAdd">Lägg till</button>
    </div>
    <div class="lbl">Status</div>
    <div class="seg" id="tbStatus">
      <button type="button" data-s="new" class="s-new">New</button>
      <button type="button" data-s="open" class="s-open">Open</button>
      <button type="button" data-s="done" class="s-done">Done</button>
    </div>
    <details id="tbHistory"><summary>Historik</summary><ul></ul></details>
    <div class="row-btns">
      <button type="button" class="danger" id="tbDelete">Ta bort</button>
      <button type="button" class="primary" id="tbClose">Klar</button>
    </div>
  </div>
</dialog>

<!-- Meny -->
<dialog id="menu" class="small">
  <div class="menu">
    <button id="pwBtn">Byt lösenord</button>
    <button id="logoutBtn">Logga ut</button>
    <button id="menuClose" class="ghost">Stäng</button>
  </div>
</dialog>

<!-- Byt lösenord -->
<dialog id="pwDialog" class="small">
  <form class="card" id="pwForm">
    <h1>Byt lösenord</h1>
    <input type="password" id="newPw" placeholder="Nytt lösenord" autocomplete="new-password" required>
    <input type="password" id="newPw2" placeholder="Upprepa nytt lösenord" autocomplete="new-password" required>
    <p class="err" id="pwErr"></p>
    <div class="row-btns">
      <button type="button" id="pwCancel">Avbryt</button>
      <button type="submit" class="primary" id="pwSubmit">Byt</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  const ITERATIONS = 600000;
  const STORE = 'backlogen-auth';
  const AUTOSAVE_MS = 1000;
  const LONG_PRESS_MS = 500;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => {
    const b = new Uint8Array(buf); let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  // auth = { salt, iter, key (CryptoKey), keyRaw (b64), token (b64) }
  const state = { auth: null, version: 0, dirty: false, saving: false, timer: null };
  let data = null;

  function show(id) { ['loading', 'lock', 'app'].forEach(s => { $(s).hidden = s !== id; }); }

  // =====================================================================
  //  Kryptering, inloggning och lagring
  // =====================================================================
  // Lösenordet ger 512 bitar: första halvan är krypteringsnyckel, andra halvan åtkomsttoken till servern.
  async function deriveAuth(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: unb64(salt), iterations: iter, hash: 'SHA-256' }, base, 512));
    return authFromRaw(salt, iter, b64(bits.slice(0, 32)), b64(bits.slice(32)));
  }
  async function authFromRaw(salt, iter, keyRaw, token) {
    const key = await crypto.subtle.importKey('raw', unb64(keyRaw), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    return { salt, iter, key, keyRaw, token };
  }
  async function encrypt(auth, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, auth.key, enc.encode(text));
    return { iv: b64(iv), data: b64(ct) };
  }
  async function decrypt(auth, p) {
    return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, auth.key, unb64(p.data)));
  }

  function remember(auth) {
    try { localStorage.setItem(STORE, JSON.stringify({ salt: auth.salt, iter: auth.iter, keyRaw: auth.keyRaw, token: auth.token })); } catch {}
  }
  function forget() { try { localStorage.removeItem(STORE); } catch {} }
  function isRemembered() { try { return !!localStorage.getItem(STORE); } catch { return false; } }
  async function loadRemembered(meta) {
    try {
      const r = JSON.parse(localStorage.getItem(STORE));
      if (!r || r.salt !== meta.salt) return null;
      return await authFromRaw(r.salt, r.iter, r.keyRaw, r.token);
    } catch { return null; }
  }

  async function api(method, path, auth, body) {
    const headers = { 'content-type': 'application/json' };
    if (auth) headers.authorization = 'Bearer ' + auth.token;
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    let d = null; try { d = await res.json(); } catch {}
    return { status: res.status, ok: res.ok, data: d };
  }

  async function openDoc(auth) {
    const r = await api('GET', '/api/doc', auth);
    if (r.status === 401) return false;
    if (!r.ok) throw new Error('Serverfel (' + r.status + ')');
    data = parseData(await decrypt(auth, r.data));
    state.auth = auth;
    state.version = r.data.version;
    setStatus('Sparat', 'saved');
    show('app');
    render();
    return true;
  }

  let meta = null;
  async function start() {
    if (!window.crypto || !crypto.subtle) {
      show('lock'); $('lockErr').textContent = 'Webbläsaren saknar stöd för kryptering (kräver https).';
      $('lockBtn').disabled = true; return;
    }
    let r;
    try { r = await api('GET', '/api/meta'); } catch (ex) { r = { ok: false, status: 0, data: { error: ex.message } }; }
    if (!r.ok || !r.data) {
      show('lock');
      $('lockErr').textContent = 'Kunde inte nå servern (status ' + r.status + (r.data && r.data.error ? ', ' + r.data.error : '') + ').';
      $('lockBtn').disabled = true; return;
    }
    meta = r.data;
    if (!meta.initialized) {
      $('lockHint').textContent = 'Första gången. Välj ett lösenord (gärna en lång fras) som skyddar innehållet.';
      $('pw').autocomplete = 'new-password';
      $('pw2').hidden = false; $('pw2').required = true;
      $('lockBtn').textContent = 'Skapa';
      show('lock'); $('pw').focus();
      return;
    }
    const saved = await loadRemembered(meta);
    if (saved) {
      try { if (await openDoc(saved)) return; } catch {}
      forget();
    }
    show('lock'); $('pw').focus();
  }

  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value, err = $('lockErr'), btn = $('lockBtn');
    err.textContent = '';
    if (!meta.initialized && pw !== $('pw2').value) { err.textContent = 'Lösenorden matchar inte.'; return; }
    btn.disabled = true; const label = btn.textContent; btn.textContent = 'Arbetar…';
    try {
      if (!meta.initialized) {
        const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
        const auth = await deriveAuth(pw, salt, ITERATIONS);
        const r = await api('POST', '/api/doc', null,
          { salt, iter: ITERATIONS, token: auth.token, ...(await encrypt(auth, JSON.stringify(emptyData()))) });
        if (r.status === 409) { err.textContent = 'Sidan har redan skapats. Ladda om.'; return; }
        if (!r.ok) throw new Error('Serverfel (' + r.status + ')');
        meta = { initialized: true, salt, iter: ITERATIONS };
        if (!(await openDoc(auth))) throw new Error('Kunde inte öppna');
        if ($('remember').checked) remember(auth);
      } else {
        const auth = await deriveAuth(pw, meta.salt, meta.iter);
        if (!(await openDoc(auth))) { err.textContent = 'Fel lösenord.'; return; }
        if ($('remember').checked) remember(auth);
      }
      $('pw').value = $('pw2').value = '';
    } catch (ex) {
      err.textContent = ex.message || 'Något gick fel.';
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  });

  function setStatus(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || ''; }

  function scheduleSave() {
    state.dirty = true;
    setStatus('Osparat', 'dirty');
    clearTimeout(state.timer);
    state.timer = setTimeout(save, AUTOSAVE_MS);
  }

  async function save(newAuth) {
    clearTimeout(state.timer);
    if (state.saving) {
      if (!newAuth) { state.timer = setTimeout(save, 500); return; }
      while (state.saving) await new Promise(r => setTimeout(r, 100));
    }
    if (!state.dirty && !newAuth) return;
    state.saving = true;
    state.dirty = false;
    setStatus('Sparar…');
    try {
      const target = newAuth || state.auth;
      const body = { ...(await encrypt(target, JSON.stringify(data))), baseVersion: state.version };
      if (newAuth) body.newAuth = { salt: newAuth.salt, iter: newAuth.iter, token: newAuth.token };
      const r = await api('PUT', '/api/doc', state.auth, body);

      if (r.status === 409) {
        state.dirty = true;
        const overwrite = confirm('Backloggen har ändrats på en annan enhet sedan du öppnade den.\n\n' +
          'OK = skriv över med din version\nAvbryt = ladda om och visa den senaste versionen (dina senaste ändringar försvinner)');
        if (overwrite) { state.version = r.data.version; state.saving = false; return save(newAuth); }
        state.dirty = false; location.reload(); return;
      }
      if (r.status === 401) {
        state.dirty = false; forget();
        alert('Lösenordet har ändrats på en annan enhet. Logga in igen.');
        location.reload(); return;
      }
      if (!r.ok) throw new Error('Serverfel (' + r.status + ')');

      state.version = r.data.version;
      if (newAuth) { state.auth = newAuth; meta.salt = newAuth.salt; meta.iter = newAuth.iter; }
      if (!state.dirty) setStatus('Sparat', 'saved');
      return true;
    } catch (ex) {
      state.dirty = true;
      setStatus('Ej sparat – försöker igen', 'dirty');
      state.timer = setTimeout(save, 5000);
      if (newAuth) throw ex;
    } finally {
      state.saving = false;
    }
  }

  window.addEventListener('beforeunload', e => { if (state.dirty || state.saving) { e.preventDefault(); e.returnValue = ''; } });
  // Spara direkt när appen läggs i bakgrunden på mobilen.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    if (ui.editingId) finishEdit(true);
    if (state.dirty) save();
  });

  // =====================================================================
  //  Datamodell
  // =====================================================================
  // data = { v: 2, items: [{ id, title, notes, tags[], status, created, updated }], log: [{ t, id, from, to }] }
  // Listans ordning = prioritet. Loggen får en rad när ett item skapas (from: null),
  // vid varje statusbyte och när ett item tas bort (to: 'deleted').
  const LABEL = { new: 'New', open: 'Open', done: 'Done', deleted: 'Borttagen' };
  const now = () => new Date().toISOString();
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  function emptyData() { return { v: 2, items: [], log: [] }; }
  function parseData(text) {
    try {
      const d = JSON.parse(text);
      if (d && Array.isArray(d.items) && Array.isArray(d.log)) return d;
    } catch {}
    // Äldre version av sidan sparade fri HTML-text – ta med den som ett item om den inte är tom.
    const d = emptyData();
    const plain = String(text || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (plain && !/^Backlogen Börja skriva här/.test(plain)) {
      const t = now();
      const it = { id: uid(), title: 'Importerad anteckning', notes: plain, tags: [], status: 'new', created: t, updated: t };
      d.items.push(it); d.log.push({ t, id: it.id, from: null, to: 'new' });
    }
    return d;
  }

  function addItemAt(index, title, notes, tags, status) {
    const t = now();
    const it = { id: uid(), title, notes, tags, status: 'new', created: t, updated: t };
    data.items.splice(index, 0, it);
    data.log.push({ t, id: it.id, from: null, to: 'new' });
    if (status !== 'new') setItemStatus(it, status);
    return it;
  }
  function setItemStatus(it, to) {
    if (it.status === to) return;
    const t = now();
    data.log.push({ t, id: it.id, from: it.status, to });
    it.status = to; it.updated = t;
  }
  function deleteItem(it) {
    data.log.push({ t: now(), id: it.id, from: it.status, to: 'deleted' });
    data.items = data.items.filter(x => x !== it);
  }
  const byId = id => data.items.find(x => x.id === id);
  function commit() { render(); scheduleSave(); }

  function normTag(s) { return s.trim().replace(/^#+/, '').replace(/\s+/g, ' ').toLowerCase().slice(0, 30); }
  function tagHue(tag) { let h = 0; for (const c of tag) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
  function allTags() {
    const m = new Map();
    data.items.forEach(it => it.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'sv'));
  }

  // =====================================================================
  //  Lista
  // =====================================================================
  const DRAFT = '__draft';
  // editingId: id för raden som redigeras inline (eller DRAFT för ett nytt item).
  // draftBefore: id för item:et som det nya ska hamna före (null = sist).
  const ui = { view: 'list', status: 'active', tags: new Set(), editingId: null, draftBefore: null, period: 'week', boxId: null };
  const STATUS_FILTERS = [['active', 'Aktiva (New + Open)'], ['new', 'New'], ['open', 'Open'], ['done', 'Done'], ['all', 'Alla']];
  const list = $('list');

  function matchesStatus(it, f) { return f === 'all' || (f === 'active' ? it.status !== 'done' : it.status === f); }
  function matchesTags(it) { for (const t of ui.tags) if (!it.tags.includes(t)) return false; return true; }
  function visibleItems() { return data.items.filter(it => matchesStatus(it, ui.status) && matchesTags(it)); }

  const insBtn = before => `<div class="ins"><button data-ins="${before || ''}" aria-label="Lägg till item här">+</button></div>`;

  function itemHtml(it) {
    if (ui.editingId === it.id) return editHtml(it.id, it.title, it.notes || '', it.status);
    return `<div class="item s-${it.status}">
        <div class="body" data-act="edit">
          <span class="title">${esc(it.title)}</span>
          ${it.tags.map(t => `<span class="tagchip" style="--h:${tagHue(t)}">#${esc(t)}</span>`).join('')}
          ${it.notes ? '<span class="note" title="Har beskrivning">📝</span>' : ''}
        </div>
        <div class="handle" aria-label="Dra för att flytta">⋮⋮</div>
      </div>`;
  }
  function editHtml(id, title, notes, status) {
    return `<div class="item editing s-${status}">
        <div class="edit">
          <input class="e-title" value="${esc(title)}" placeholder="Rubrik" maxlength="300" autocomplete="off" enterkeyhint="done">
          <textarea class="e-notes" rows="1" placeholder="Beskrivning">${esc(notes)}</textarea>
        </div>
        ${id === DRAFT ? '<div></div>' : '<div class="handle" aria-label="Dra för att flytta">⋮⋮</div>'}
      </div>`;
  }

  function render() {
    if (!data) return;
    $('filters').hidden = ui.view !== 'list';
    $('listView').hidden = ui.view !== 'list';
    $('statsView').hidden = ui.view !== 'stats';
    document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('on', b.dataset.view === ui.view));
    if (ui.view === 'stats') { renderStats(); return; }

    // Statusfilter (antal räknas inom valda taggar)
    const tagged = data.items.filter(matchesTags);
    $('statusSelect').innerHTML = STATUS_FILTERS.map(([k, l]) =>
      `<option value="${k}"${ui.status === k ? ' selected' : ''}>${l} (${tagged.filter(it => matchesStatus(it, k)).length})</option>`).join('');

    // Taggfilter
    const tags = allTags();
    for (const t of [...ui.tags]) if (!tags.some(([n]) => n === t)) ui.tags.delete(t);
    $('tagFilter').innerHTML = (ui.tags.size ? '<button class="chip" data-cleartags>✕ Rensa</button>' : '') +
      tags.map(([t, n]) => `<button class="chip tag${ui.tags.has(t) ? ' on' : ''}" style="--h:${tagHue(t)}" data-tag="${esc(t)}">#${esc(t)}<span class="n">${n}</span></button>`).join('');

    // Items, med ett "+" ovanför varje rad och ett efter sista raden.
    const vis = visibleItems();
    const draftRow = ui.editingId === DRAFT ? `<li class="row" data-id="${DRAFT}">${insBtn(null)}${editHtml(DRAFT, '', '', 'new')}</li>` : '';
    let html = '';
    for (const it of vis) {
      if (draftRow && ui.draftBefore === it.id) html += draftRow;
      html += `<li class="row" data-id="${it.id}">${insBtn(it.id)}${itemHtml(it)}</li>`;
    }
    if (draftRow && (!ui.draftBefore || !vis.some(it => it.id === ui.draftBefore))) html += draftRow;
    html += `<li class="ins-end">${insBtn(null)}${!vis.length && !draftRow ? `<div class="empty">${data.items.length ? 'Inga items matchar filtret.' : 'Backloggen är tom.'} Tryck på + för att lägga till.</div>` : ''}</li>`;
    list.innerHTML = html;

    // Fokus i raden som redigeras.
    const editing = list.querySelector('.item.editing');
    if (editing) {
      const ta = editing.querySelector('.e-notes'); autoGrow(ta);
      const inp = editing.querySelector('.e-title');
      inp.focus({ preventScroll: true });
      inp.setSelectionRange(inp.value.length, inp.value.length);
      const r = editing.getBoundingClientRect();
      if (r.bottom > innerHeight - 20 || r.top < 100) editing.scrollIntoView({ block: 'center' });
    }
  }
  function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  function flash(id) {
    const el = list.querySelector(`.row[data-id="${id}"] .item`);
    if (!el) return;
    el.classList.add('flash');
    const r = el.getBoundingClientRect(), top = document.querySelector('header.top').getBoundingClientRect().bottom;
    if (r.top < top || r.bottom > innerHeight) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    setTimeout(() => el.classList.remove('flash'), 500);
  }

  // ---- Inline-redigering ----
  function startEdit(id) {
    if (ui.editingId) finishEdit(true);
    ui.editingId = id;
    render();
  }
  function startDraft(before) {
    if (ui.editingId) finishEdit(true);
    ui.editingId = DRAFT;
    ui.draftBefore = before || null;
    render();
  }
  function draftIndex() {
    if (ui.draftBefore) { const i = data.items.indexOf(byId(ui.draftBefore)); if (i >= 0) return i; }
    const vis = visibleItems();
    return vis.length ? data.items.indexOf(vis[vis.length - 1]) + 1 : data.items.length;
  }
  // Avslutar redigeringen. Tom rubrik på ett nytt item = inget skapas. Tom rubrik på befintligt = ändringen ignoreras.
  function finishEdit(keep) {
    pendingFinish = false;
    const id = ui.editingId; if (!id) return;
    const row = list.querySelector('.item.editing');
    const title = row ? row.querySelector('.e-title').value.trim() : '';
    const notes = row ? row.querySelector('.e-notes').value.trim() : '';
    let changed = false, flashId = null;
    if (keep && row && title) {
      if (id === DRAFT) {
        const status = ['new', 'open', 'done'].includes(ui.status) ? ui.status : 'new';
        flashId = addItemAt(draftIndex(), title, notes, [...ui.tags], status).id;
        changed = true;
      } else {
        const it = byId(id);
        if (it && (it.title !== title || (it.notes || '') !== notes)) {
          it.title = title; it.notes = notes; it.updated = now(); changed = true;
        }
      }
    }
    ui.editingId = null; ui.draftBefore = null;
    if (document.activeElement && list.contains(document.activeElement)) document.activeElement.blur();
    changed ? commit() : render();
    if (flashId) flash(flashId);
  }

  // Ett tryck utanför raden som redigeras avslutar redigeringen. Det görs först när trycket
  // är klart, så att samma tryck kan öppna en annan rad eller ett "+".
  let pointerIsDown = false, pendingFinish = false;
  document.addEventListener('pointerdown', e => {
    pointerIsDown = true;
    const editing = list.querySelector('.item.editing');
    if (editing && !editing.contains(e.target) && !e.target.closest('dialog')) pendingFinish = true;
  }, true);
  const pointerRelease = () => { pointerIsDown = false; if (pendingFinish) setTimeout(() => { if (pendingFinish) finishEdit(true); }, 0); };
  document.addEventListener('pointerup', pointerRelease, true);
  document.addEventListener('pointercancel', pointerRelease, true);
  // Tangentbord / fokus som lämnar raden (t.ex. Tab eller "Klar" på mobilens tangentbord).
  list.addEventListener('focusout', () => {
    setTimeout(() => {
      const editing = list.querySelector('.item.editing');
      if (!ui.editingId || !editing || editing.contains(document.activeElement)) return;
      if (pointerIsDown) pendingFinish = true; else finishEdit(true);
    }, 0);
  });
  list.addEventListener('keydown', e => {
    if (!e.target.closest('.item.editing')) return;
    if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
    else if (e.key === 'Enter' && e.target.classList.contains('e-title')) { e.preventDefault(); finishEdit(true); }
  });
  list.addEventListener('input', e => { if (e.target.classList.contains('e-notes')) autoGrow(e.target); });

  list.addEventListener('click', e => {
    if (drag || Date.now() - suppressClickUntil < 0) return;
    const ins = e.target.closest('[data-ins]');
    if (ins) { const before = ins.dataset.ins; pendingFinish = false; startDraft(before); return; }
    const body = e.target.closest('[data-act="edit"]');
    if (body) { const id = body.closest('.row').dataset.id; pendingFinish = false; startEdit(id); }
  });

  // ---- Långt tryck: öppnar rutan för taggar ----
  let press = null, suppressClickUntil = 0;
  list.addEventListener('contextmenu', e => { if (e.target.closest('.body')) e.preventDefault(); });
  list.addEventListener('pointerdown', e => {
    if (e.target.closest('.handle')) return startDrag(e);
    const body = e.target.closest('.body'); if (!body) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const item = body.closest('.item'), id = body.closest('.row').dataset.id;
    item.classList.add('pressing');
    press = { x: e.clientX, y: e.clientY, item, fired: false,
      t: setTimeout(() => {
        press.fired = true; item.classList.remove('pressing');
        if (navigator.vibrate) navigator.vibrate(15);
        if (pendingFinish) finishEdit(true);
        openTagBox(id);
      }, LONG_PRESS_MS) };
  });
  function cancelPress() { if (!press) return; clearTimeout(press.t); press.item.classList.remove('pressing'); press = null; }
  list.addEventListener('pointermove', e => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
    if (drag) { drag.y = e.clientY; positionDrag(); }
  });
  list.addEventListener('pointerup', e => {
    if (press && press.fired) suppressClickUntil = Date.now() + 400;
    cancelPress();
    endDrag();
  });
  list.addEventListener('pointercancel', () => { cancelPress(); endDrag(); });

  // ---- Drag and drop (pekare: fungerar med finger och mus) ----
  // Raderna flyttas i DOM:en medan man drar. När man släpper skrivs den nya ordningen
  // tillbaka till de platser i den fullständiga listan som de synliga items hade,
  // så dolda (filtrerade) items ligger kvar där de var.
  let drag = null;
  function startDrag(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    if (ui.editingId) { pendingFinish = false; finishEdit(true); }
    const handle = list.querySelector(`.row[data-id="${e.target.closest('.row').dataset.id}"] .handle`);
    if (!handle) return;
    const el = handle.closest('.row');
    try { handle.setPointerCapture(e.pointerId); } catch {}
    drag = { el, grab: e.clientY - el.getBoundingClientRect().top, y: e.clientY, before: rowIds().join() };
    el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (navigator.vibrate) navigator.vibrate(10);
    drag.raf = requestAnimationFrame(dragLoop);
  }
  const rowIds = () => [...list.querySelectorAll(':scope > .row')].map(x => x.dataset.id);
  const isRow = el => el && el.classList.contains('row');

  function dragLoop() {
    if (!drag) return;
    // Autoscroll nära kanterna.
    const topEdge = document.querySelector('header.top').getBoundingClientRect().bottom;
    if (drag.y < topEdge + 50) scrollBy(0, -Math.ceil((topEdge + 50 - drag.y) / 6));
    else if (drag.y > innerHeight - 70) scrollBy(0, Math.ceil((drag.y - innerHeight + 70) / 6));
    positionDrag();
    drag.raf = requestAnimationFrame(dragLoop);
  }
  function positionDrag() {
    // Mät i listans layoutkoordinater (offsetTop påverkas inte av pågående animationer).
    const el = drag.el, top = drag.y - drag.grab - list.getBoundingClientRect().top;
    for (let guard = 0; guard < 200; guard++) {
      const prev = el.previousElementSibling, next = el.nextElementSibling;
      if (isRow(prev) && top < prev.offsetTop + prev.offsetHeight / 2) { animateSwap(prev, () => list.insertBefore(el, prev)); continue; }
      if (isRow(next) && top + el.offsetHeight > next.offsetTop + next.offsetHeight / 2) { animateSwap(next, () => list.insertBefore(el, next.nextElementSibling)); continue; }
      break;
    }
    el.style.transform = `translateY(${top - el.offsetTop}px)`;
  }
  // Liten glidanimation för raden som byter plats med den man drar (FLIP).
  function animateSwap(other, doMove) {
    const before = other.offsetTop;
    doMove();
    const delta = before - other.offsetTop;
    other.style.transition = 'none';
    other.style.transform = `translateY(${delta}px)`;
    requestAnimationFrame(() => { other.style.transition = 'transform .15s'; other.style.transform = ''; });
  }
  function endDrag() {
    if (!drag) return;
    cancelAnimationFrame(drag.raf);
    positionDrag();
    const { el } = drag;
    el.classList.remove('dragging'); el.style.transform = '';
    document.body.classList.remove('is-dragging');
    const ids = rowIds();
    const changed = ids.join() !== drag.before;
    drag = null; suppressClickUntil = Date.now() + 60;
    if (!changed) return;
    const vis = ids.map(byId);
    const slots = vis.map(it => data.items.indexOf(it)).sort((a, b) => a - b);
    slots.forEach((slot, k) => { data.items[slot] = vis[k]; });
    commit();
    flash(el.dataset.id);
  }

  // ---- Filter och flikar ----
  $('statusSelect').addEventListener('change', e => { ui.status = e.target.value; ui.editingId = null; render(); });
  $('tagFilter').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-cleartags')) ui.tags.clear();
    else { const t = b.dataset.tag; ui.tags.has(t) ? ui.tags.delete(t) : ui.tags.add(t); }
    if (ui.editingId) finishEdit(true); else render();
  });
  $('viewTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if (!b) return;
    if (ui.editingId) finishEdit(true);
    ui.view = b.dataset.view; render(); scrollTo(0, 0);
  });

  // =====================================================================
  //  Ruta för taggar / status (långt tryck)
  // =====================================================================
  const box = $('tagBox');
  function openTagBox(id) {
    const it = byId(id); if (!it) return;
    ui.boxId = id;
    $('tbTitle').textContent = it.title;
    $('tbNewTag').value = '';
    const fmt = t => new Date(t).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
    $('tbHistory').querySelector('ul').innerHTML = data.log.filter(l => l.id === id).reverse()
      .map(l => `<li>${fmt(l.t)}: ${l.from ? `${LABEL[l.from]} → ${LABEL[l.to]}` : 'Skapad'}</li>`).join('');
    $('tbHistory').open = false;
    renderTagBox();
    box.showModal();
  }
  function renderTagBox() {
    const it = byId(ui.boxId); if (!it) return;
    document.querySelectorAll('#tbStatus button').forEach(b => b.classList.toggle('on', b.dataset.s === it.status));
    const tags = new Set([...allTags().map(([t]) => t), ...it.tags]);
    $('tbTags').innerHTML = [...tags].sort((a, b) => a.localeCompare(b, 'sv')).map(t =>
      `<button type="button" class="chip tag${it.tags.includes(t) ? ' on' : ''}" style="--h:${tagHue(t)}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')
      || '<span style="color:var(--muted);font-size:.85rem">Inga taggar än – skriv en nedan.</span>';
  }
  function addBoxTags() {
    const it = byId(ui.boxId); if (!it) return;
    const add = $('tbNewTag').value.split(',').map(normTag).filter(t => t && !it.tags.includes(t));
    $('tbNewTag').value = '';
    if (!add.length) return;
    it.tags.push(...add); it.updated = now();
    commit(); renderTagBox();
  }
  $('tbTags').addEventListener('click', e => {
    const b = e.target.closest('[data-tag]'); const it = byId(ui.boxId); if (!b || !it) return;
    const t = b.dataset.tag;
    it.tags = it.tags.includes(t) ? it.tags.filter(x => x !== t) : [...it.tags, t];
    it.updated = now();
    commit(); renderTagBox();
  });
  $('tbAdd').addEventListener('click', addBoxTags);
  $('tbNewTag').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addBoxTags(); } });
  $('tbStatus').addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); const it = byId(ui.boxId); if (!b || !it) return;
    setItemStatus(it, b.dataset.s); commit(); renderTagBox();
  });
  $('tbDelete').addEventListener('click', () => {
    const it = byId(ui.boxId);
    if (!it || !confirm('Ta bort "' + it.title + '"?')) return;
    deleteItem(it); box.close(); commit();
  });
  $('tbClose').addEventListener('click', () => box.close());
  box.addEventListener('close', () => {
    if ($('tbNewTag').value.trim()) addBoxTags();
    const id = ui.boxId; ui.boxId = null;
    if (id) flash(id);
  });

  // =====================================================================
  //  Statistik
  // =====================================================================
  function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  function isoWeek(d) {
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
    return Math.ceil(((x - Date.UTC(x.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }
  const MONTHS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

  function buckets(period, n = 12) {
    const today = new Date(), out = [];
    for (let i = n - 1; i >= 0; i--) {
      let s, e, short, long;
      if (period === 'week') {
        s = startOfWeek(today); s.setDate(s.getDate() - 7 * i);
        e = new Date(s); e.setDate(e.getDate() + 7);
        short = 'v' + isoWeek(s); long = 'Vecka ' + isoWeek(s) + ', ' + s.getFullYear();
      } else {
        s = new Date(today.getFullYear(), today.getMonth() - i, 1);
        e = new Date(s.getFullYear(), s.getMonth() + 1, 1);
        short = MONTHS[s.getMonth()]; long = MONTHS[s.getMonth()] + ' ' + s.getFullYear();
      }
      out.push({ s: +s, e: +e, short, long, created: 0, done: 0 });
    }
    for (const l of data.log) {
      const t = +new Date(l.t);
      const b = out.find(b => t >= b.s && t < b.e); if (!b) continue;
      if (l.from === null) b.created++;
      else if (l.to === 'done') b.done++;
    }
    return out;
  }

  function renderStats() {
    const created = data.log.filter(l => l.from === null).length;
    const doneCount = data.items.filter(it => it.status === 'done').length;
    const remaining = data.items.filter(it => it.status !== 'done').length;
    // Ledtid: från skapad till senaste "done" för items som är klara nu.
    const lastDone = new Map();
    data.log.forEach(l => { if (l.to === 'done') lastDone.set(l.id, l.t); });
    const leads = data.items.filter(it => it.status === 'done' && lastDone.has(it.id))
      .map(it => (new Date(lastDone.get(it.id)) - new Date(it.created)) / 864e5).sort((a, b) => a - b);
    const median = leads.length ? leads[Math.floor(leads.length / 2)] : null;
    const fmtDays = d => d == null ? '–' : d < 1 ? '< 1 dag' : Math.round(d) + (Math.round(d) === 1 ? ' dag' : ' dagar');

    const bs = buckets(ui.period);
    $('statsView').innerHTML = `
      <div class="tiles">
        <div class="tile"><div class="v">${created}</div><div class="k">Skapade totalt</div></div>
        <div class="tile"><div class="v">${doneCount}</div><div class="k">Klara (Done)</div></div>
        <div class="tile"><div class="v">${remaining}</div><div class="k">Kvar (New + Open)</div></div>
        <div class="tile"><div class="v">${fmtDays(median)}</div><div class="k">Mediantid till Done</div></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>Skapade och klarade</h3><span class="spacer"></span>
          <div class="tabs" id="periodTabs">
            <button data-p="week" class="${ui.period === 'week' ? 'on' : ''}">Vecka</button>
            <button data-p="month" class="${ui.period === 'month' ? 'on' : ''}">Månad</button>
          </div>
        </div>
        <div class="legend"><span style="--c:var(--series-1)">Skapade</span><span style="--c:var(--series-2)">Klarade</span></div>
        <div id="chart"></div>
        <details><summary>Visa som tabell</summary>
          <table class="data"><thead><tr><th>${ui.period === 'week' ? 'Vecka' : 'Månad'}</th><th>Skapade</th><th>Klarade</th></tr></thead>
          <tbody>${bs.slice().reverse().map(b => `<tr><td>${b.long}</td><td>${b.created}</td><td>${b.done}</td></tr>`).join('')}</tbody></table>
        </details>
      </div>`;
    $('periodTabs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { ui.period = b.dataset.p; renderStats(); } });
    renderChart(bs);
  }

  function niceStep(max) {
    const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const f of [1, 2, 5, 10]) if (f * p >= raw) return Math.max(1, f * p);
    return Math.max(1, 10 * p);
  }
  function barPath(x, y, w, h) {
    if (h <= 0) return '';
    const r = Math.min(4, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  function renderChart(bs) {
    const wrap = $('chart'); if (!wrap) return;
    const W = Math.max(260, wrap.clientWidth), H = 190;
    const m = { l: 26, r: 4, t: 8, b: 22 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(1, ...bs.map(b => Math.max(b.created, b.done)));
    const step = niceStep(max), top = Math.ceil(max / step) * step;
    const gw = iw / bs.length, bw = Math.max(3, Math.min(16, (gw - 8) / 2 - 1));
    const y = v => m.t + ih - (v / top) * ih;
    const every = Math.max(1, Math.ceil(30 / gw));
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Skapade och klarade items per ${ui.period === 'week' ? 'vecka' : 'månad'}">`;
    for (let v = step; v <= top; v += step)
      s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    bs.forEach((b, i) => {
      const cx = m.l + gw * i + gw / 2;
      s += `<g class="grp" data-i="${i}">` +
        `<path class="bar c" d="${barPath(cx - 1 - bw, y(b.created), bw, y(0) - y(b.created))}"/>` +
        `<path class="bar d" d="${barPath(cx + 1, y(b.done), bw, y(0) - y(b.done))}"/></g>`;
      if ((bs.length - 1 - i) % every === 0) s += `<text class="tick" x="${cx}" y="${H - 6}" text-anchor="middle">${b.short}</text>`;
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
    s += `<rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H}"/></svg><div class="tip" hidden></div>`;
    wrap.innerHTML = s;

    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const showAt = clientX => {
      const r = svg.getBoundingClientRect();
      const i = Math.min(bs.length - 1, Math.max(0, Math.floor((clientX - r.left - m.l) / gw)));
      const b = bs[i];
      svg.classList.add('active');
      svg.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', +g.dataset.i === i));
      tip.innerHTML = `<b>${b.long}</b><i style="background:var(--series-1)"></i>Skapade ${b.created}<br><i style="background:var(--series-2)"></i>Klarade ${b.done}`;
      tip.hidden = false;
      // Placera tooltip bredvid staplarna så att den inte täcker dem.
      const cx = m.l + gw * i + gw / 2, tw = tip.offsetWidth;
      const left = cx > W / 2 ? cx - gw / 2 - tw - 4 : cx + gw / 2 + 4;
      tip.style.left = Math.min(W - tw, Math.max(0, left)) + 'px';
      tip.style.top = m.t + 'px';
    };
    const hide = () => { svg.classList.remove('active'); tip.hidden = true; };
    svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showAt(e.clientX); });
    svg.addEventListener('pointerdown', e => showAt(e.clientX));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  }
  // Tryck utanför diagrammet döljer tooltip.
  document.addEventListener('pointerdown', e => {
    const w = $('chart'); if (!w || w.contains(e.target)) return;
    const svg = w.querySelector('svg'), tip = w.querySelector('.tip');
    if (svg) svg.classList.remove('active'); if (tip) tip.hidden = true;
  });
  let resizeT;
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ui.view === 'stats' && data) renderStats(); }, 150); });

  // =====================================================================
  //  Meny, lösenord, utloggning
  // =====================================================================
  const menu = $('menu'), dlg = $('pwDialog');
  $('menuBtn').addEventListener('click', () => menu.showModal());
  $('menuClose').addEventListener('click', () => menu.close());
  // Tryck utanför en ruta stänger den – men bara om trycket både började och slutade utanför
  // (annars stängs taggrutan direkt av samma långa tryck som öppnade den).
  for (const d of [box, menu]) {
    let downOutside = false;
    d.addEventListener('pointerdown', e => { downOutside = e.target === d; });
    d.addEventListener('click', e => { if (e.target === d && downOutside) d.close(); downOutside = false; });
  }
  $('pwBtn').addEventListener('click', () => { menu.close(); $('pwErr').textContent = ''; dlg.showModal(); $('newPw').focus(); });
  $('pwCancel').addEventListener('click', () => dlg.close());
  $('pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('newPw').value, b = $('newPw2').value, btn = $('pwSubmit');
    if (a !== b) { $('pwErr').textContent = 'Lösenorden matchar inte.'; return; }
    btn.disabled = true;
    try {
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const newAuth = await deriveAuth(a, salt, ITERATIONS);
      const wasRemembered = isRemembered();
      if (await save(newAuth)) {
        if (wasRemembered) remember(newAuth); else forget();
        $('newPw').value = $('newPw2').value = '';
        dlg.close();
        setStatus('Lösenord bytt', 'saved');
      }
    } catch (ex) {
      $('pwErr').textContent = 'Kunde inte byta lösenord: ' + (ex.message || ex);
    } finally {
      btn.disabled = false;
    }
  });
  $('logoutBtn').addEventListener('click', async () => {
    menu.close();
    if (ui.editingId) finishEdit(true);
    if (state.dirty) await save();
    forget();
    location.reload();
  });

  start();
})();
</script>
</body>
</html>
